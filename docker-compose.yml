services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-email-backend
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./tokens:/app/tokens
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=development
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - DRY_RUN=${DRY_RUN:-true}
      - DEMO_MODE=${DEMO_MODE:-true}
      - DEMO_REFERENCE_TIME=${DEMO_REFERENCE_TIME:-}
      - AGENT_ENABLED=${AGENT_ENABLED:-true}
      - AGENT_MODE=${AGENT_MODE:-semi_auto}
      - AGENT_SHADOW_MODE=${AGENT_SHADOW_MODE:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
    command: python -m llm_email_app.main
